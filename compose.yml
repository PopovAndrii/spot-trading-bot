services:
    app:
        build:
            context: .
            dockerfile: docker-config/Dockerfile
            target: dev # код и node_modules приходят bind-mount'ом
        image: exchange-crypto
        container_name: exchange-crypto-${PREFIX_CONTAINER_NAME:-dev}
        restart: unless-stopped
        working_dir: /var/www/src
        volumes:
            - .:/var/www
            - ./.bash_history:/home/node/.bash_history:rw
            - ./tmp/app/:/home/node/.npm/
            - /etc/localtime:/etc/localtime:ro
        networks:
            - exchange-crypto
        ports:
            - ${PORT:-3002}:${PORT:-3002}
            # browser-sync (live-reload) — чтобы работал и http://localhost:3000
            - 3000:3000
        env_file:
            # required:false — контейнер стартует даже без .env (его создаст setup-user)
            - path: .env
              required: false
        environment:
            NODE_ENV: ${NODE_ENV:-production}
            STATUS_APP: ${STATUS_APP:-false}
            STATUS_LOGIN: ${STATUS_LOGIN:-true}
            PORT: ${PORT:-3002}
        # Автостарт dev-сервера (sass watch + nodemon + browser-sync): раньше был
        # sleep infinity, и после рестарта контейнера приложение «не работало»,
        # пока npm run dev не запустят руками. Фоллбэк в sleep — если dev-сервер
        # не смог стартовать (нет node_modules и т.п.), контейнер остаётся живым,
        # чтобы можно было зайти и починить.
        command: ["bash", "-c", "npm run dev || sleep infinity"]
        # curl ставится в образ ровно для этого; 302 на /login для curl -f
        # ошибкой не является — проверяем, что сервер вообще слушает
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:${PORT:-3002}/api/ping"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

    # --- nginx ОТКЛЮЧЁН (не нужен) ---
    # Это PHP-прокси (fastcgi_pass → :9000, root src/php/) от старой PHP-версии,
    # к Node-приложению не относится — оно отдаётся напрямую через app.ports (${PORT}).
    # Чтобы вернуть: раскомментировать блок ниже и добавить в сервис app:
    #     depends_on:
    #         - nginx
    # nginx:
    #     image: nginx:latest
    #     container_name: exchange-crypto-nginx-${PREFIX_CONTAINER_NAME:-dev}
    #     restart: unless-stopped
    #     ports:
    #         - ${NGINX_PORT:-8002}:80
    #         - ${NGINX_PORT_SSL:-445}:443
    #     volumes:
    #         - .:/var/www
    #         - ./docker-config/nginx/conf.d/:/etc/nginx/conf.d/
    #     networks:
    #         - exchange-crypto

networks:
    exchange-crypto:
        driver: bridge
        name: exchange-crypto-${PREFIX_CONTAINER_NAME:-dev}
