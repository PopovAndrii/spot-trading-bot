services:
    app:
        build:
            args:
                - USER=${USER}
                - UID=${UID-1000}
                - GID=${GID-1000}
            context: .
            dockerfile: docker-config/Dockerfile
        image: exchange-crypto
        container_name: exchange-crypto-app
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./src:/var/www
            - ./docker-config/php.ini:/usr/local/etc/php/conf.d/php.ini
            - ./.bash_history:/home/${USER}/.bash_history
            - ./tmp/app/:/home/${USER}/.npm/
            - /etc/localtime:/etc/localtime:ro
        depends_on:
            - nginx
        networks:
            - exchange-crypto
        ports:
            - ${PORT}:3002

    nginx:
        image: nginx:latest
        container_name: exchange-crypto-nginx
        restart: unless-stopped
        ports:
            - ${NGINX_PORT}:80
            - ${NGINX_PORT_SSL}:443
        volumes:
            - ./src:/var/www
            - ./docker-config/nginx/conf.d/:/etc/nginx/conf.d/
        networks:
            - exchange-crypto


networks:
    exchange-crypto:
        driver: bridge
