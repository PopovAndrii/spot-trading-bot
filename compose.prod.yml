name: spot-trading-bot

services:
    app:
        build:
            context: .
            dockerfile: docker-config/Dockerfile
            target: prod # самодостаточный образ: код, прод-deps, CSS, entrypoint внутри
            args:
                # хэш и ветка для футера; передай при сборке:
                # GIT_COMMIT=$(git rev-parse --short HEAD) GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD) \
                #   docker compose -f compose.prod.yml build
                GIT_COMMIT: ${GIT_COMMIT:-}
                GIT_BRANCH: ${GIT_BRANCH:-}
        image: spot-trading-bot:latest # tag for prod
        container_name: spot-trading-bot-app
        restart: unless-stopped
        working_dir: /var/www/src
        # Bind-mount исходников больше нет (ANALYSIS п.13) — образ выкатывается
        # как артефакт. Монтируется только денежное состояние робота (data/)
        # и localtime. entrypoint.sh запечён в образ (CMD по умолчанию).
        volumes:
            - ./src/data:/var/www/src/data
            - /etc/localtime:/etc/localtime:ro
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:${PORT:-3002}/api/ping"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s

        networks:
            - proxy-network
        env_file:
            # required:false — container starts even without .env (setup-user creates it)
            - path: .env
              required: false
        # Non-secret defaults (can be overridden in .env). NODE_ENV=production
        # Important for production: otherwise the dev server (browser-sync) will start.
        environment:
            NODE_ENV: ${NODE_ENV:-production}
            STATUS_APP: ${STATUS_APP:-false}
            STATUS_LOGIN: ${STATUS_LOGIN:-true}
            PORT: ${PORT:-3002}

networks:
    proxy-network:
        name: nginxproxymanager_proxy-network
        external: true

